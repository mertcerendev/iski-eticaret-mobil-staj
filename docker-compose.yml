services:
  db:
    image: postgres:16-alpine
    container_name: iski_eticaret_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iski
      POSTGRES_PASSWORD: iski_dev_2026
      POSTGRES_DB: iski_eticaret
    ports:
      - "5433:5432"
    volumes:
      - iski_pgdata:/var/lib/postgresql/data

volumes:
  iski_pgdata: